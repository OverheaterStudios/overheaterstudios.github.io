<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Overheater Studios</title>
  <meta name="description" content="Get in touch with Overheater Studios: release updates, bug reports, press and business.">
  <meta property="og:title" content="Contact — Overheater Studios">
  <meta property="og:description" content="Get in touch with Overheater Studios: release updates, bug reports, press and business.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://overheater.com/img/apple-touch-icon.png">
  <meta name="theme-color" content="#100C0D">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" href="img/overheater-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="contact">
  <script src="js/layout.js"></script>

  <main id="main">
    <section class="contact">
      <div class="wrap contact-grid">
        <div class="contact-copy">
          <p class="kicker pixel">Say hi</p>
          <h1>Contact</h1>
          <p>Want to hear about new releases, found a bug, or writing about us? Drop us a line. We reply within two business days.</p>
          <p class="contact-direct">Prefer email? <a id="contact-email-link" href="#">hello@overheater.com</a></p>
        </div>
        <form class="contact-form" id="contact-form" novalidate>
          <label><span>What's up?</span>
            <select name="topic"></select>
          </label>
          <label><span>Name</span>
            <input name="name" type="text" autocomplete="name" required>
          </label>
          <label><span>Email</span>
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label><span>Message</span>
            <textarea name="message" rows="5" required></textarea>
          </label>
          <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn-hot" type="submit">Send message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/products.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
